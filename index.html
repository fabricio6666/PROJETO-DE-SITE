<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>FocusFlow</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <!-- ===== LOGIN ===== -->
    <div id="loginTela">

        <div class="login-box">
            <h1>Focus<span>Flow</span></h1>
            <p>Organize seus estudos aqui tchê</p>

            <form id="loginForm">
                <input type="email" id="emailLogin" placeholder="E-mail" required>
                <input type="password" id="senhaLogin" placeholder="Senha" required>

                <button type="submit">Entrar</button>
            </form>

            <p>
                Não tem conta guri?
                <a href="cadastro.html">Criar conta</a>
            </p>
        </div>

    </div>

    <!-- ===== DASHBOARD ===== -->
    <div id="dashboard" style="display: none; text-align: center;">

        <h1>Bem-vindo ao FocusFlow 🚀</h1>
        <p id="nomeUsuario"></p>

        <h3>🔥 Bora guri estudar hoje:</h3>
        <ul>
            <li>Matemática</li>
            <li>Física</li>
        </ul>

        <button onclick="logout()">Sair</button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
